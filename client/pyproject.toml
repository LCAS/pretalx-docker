[project]
name = "pretalx-client"
version = "0.1.0"
description = "Standalone command-line client for the pretalx conference management API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
pretalx-client = "pretalx_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretalx_client"]
