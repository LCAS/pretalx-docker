services:

  init-volumes:
    image: busybox
    command: /bin/sh -c "mkdir -p /mnt/data /mnt/public && chown -R 999:999 /mnt/public /mnt/data && echo 'Volumes initialized'"
    volumes:
      - ./volumes:/mnt
    restart: no

  pretalx:
    image: lcas.lincoln.ac.uk/lcas/pretalx:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: pretalx_ref11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mail:
        condition: service_started
      
    environment:
      # Hint: Make sure you serve all requests for the `/static/` and `/media/` paths when debug is False. See [installation](https://docs.pretalx.org/administrator/installation/#step-7-ssl) for more information
      #PRETALX_FILESYSTEM_MEDIA: /data/media
      PRETALX_FILESYSTEM_STATIC: /static
      # zrok terminates TLS and forwards plain HTTP over the docker network, so gunicorn
      # must trust the X-Forwarded-Proto header from the zrok container to correctly
      # detect HTTPS (otherwise redirect_uri and other absolute URLs are built as http://)
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    # ports:
    #   - "8188:80"
    volumes: 
      - ./conf/pretalx.cfg:/etc/pretalx/pretalx.cfg:ro
      - ./volumes/data:/data
      - ./volumes/public:/public
    labels:
       traefik.docker.network: "pretalxdocker"
       traefik.enable: "true"



  db:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: veryunsecureplschange # same password as one that you will put in pretalx.cfg file later on
      POSTGRES_USER: pretalx
      POSTGRES_DB: pretalx


    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pretalx"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
      start_interval: 5s

  redis:
    image: redis:latest
    #container_name: pretalx-redis
    restart: unless-stopped
    volumes: 
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
      start_interval: 5s

  mail:
    image: bytemark/smtp
    restart: unless-stopped
    environment:
      MAILNAME: "coltrane.network.uni"
      RELAY_HOST: mailslot.lincoln.ac.uk
      RELAY_PORT: 25
    healthcheck:
      test: ["CMD", "mailq"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
      start_interval: 5s
      

  cron:
    image: lcas.lincoln.ac.uk/lcas/pretalx-cron:latest
    build:
      context: ./cronjobs
      dockerfile: ./Dockerfile.cron
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


  zrok:
    # currently requires the old version as the server hasn't been updated yet
    image: openziti/zrok:1.0.8
    volumes:
      - zrok-data:/zrok/.zrok
    restart: unless-stopped
    environment:
      HOME: /zrok
      PFXLOG_NO_JSON: "true"
    entrypoint: []
    tty: true
    secrets:
      - zrok_token
    user: root
    links:
      - pretalx

    command: >
      bash -c "

      trap 'echo Stopping zrok service...; zrok release ${ZROK_NAME} || true;  zrok disable || true; echo Zrok service stopped.' EXIT;

      (zrok -p disable || true);
      zrok config set apiEndpoint ${ZROK_API_ENDPOINT} &&
      zrok enable -d '${ZROK_ENV_NAME}' $(cat /run/secrets/zrok_token) &&
      (zrok release ${ZROK_NAME} || true) &&
      zrok reserve public -n ${ZROK_NAME} http://pretalx:80 &&
      zrok share reserved ${ZROK_NAME} --headless
      "

  zrok_media:
    # currently requires the old version as the server hasn't been updated yet
    image: openziti/zrok:1.0.8
    volumes:
      - zrok-data-media:/zrok/.zrok
      - ./volumes/public:/public:ro
  
    restart: unless-stopped
    environment:
      HOME: /zrok
      PFXLOG_NO_JSON: "true"
    entrypoint: []
    tty: true
    secrets:
      - zrok_token
    user: root
    links:
      - pretalx

    command: >
      bash -c "

      trap 'echo Stopping zrok service...; zrok release ${ZROK_NAME}media || true;  zrok disable || true; echo Zrok service stopped.' EXIT;

      (zrok -p disable || true);
      zrok config set apiEndpoint ${ZROK_API_ENDPOINT} &&
      zrok enable -d '${ZROK_ENV_NAME}' $(cat /run/secrets/zrok_token) &&
      (zrok release ${ZROK_NAME}media || true) &&
      zrok reserve public -n ${ZROK_NAME}media -b web /public/media &&
      zrok share reserved ${ZROK_NAME}media --headless
      "


